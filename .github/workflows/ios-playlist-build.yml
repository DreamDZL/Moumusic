name: iOS playlist feature build

on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/**'
    paths:
      - 'platforms/ios/**'
      - '.github/workflows/ios-playlist-build.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    defaults:
      run:
        working-directory: platforms/ios/ios
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS app for simulator
        run: |
          xcodebuild build \
            -project KumoneIOS.xcodeproj \
            -scheme KumoneIOS \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Run iOS tests
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')
          test -n "$SIMULATOR_ID"
          xcodebuild test \
            -project KumoneIOS.xcodeproj \
            -scheme KumoneIOS \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath test-build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Archive unsigned iOS app
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project KumoneIOS.xcodeproj \
            -scheme KumoneIOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Music.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/music-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_STYLE=Manual

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          app_path="$(find "$RUNNER_TEMP/Music.xcarchive/Products/Applications" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -d "$app_path"
          mkdir -p "$RUNNER_TEMP/Music-ipa/Payload"
          cp -R "$app_path" "$RUNNER_TEMP/Music-ipa/Payload/"

          app_bundle="$RUNNER_TEMP/Music-ipa/Payload/$(basename "$app_path")"
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_bundle/Info.plist")
          test "$bundle_id" = "com.jiajia2222.moumusic.ios"
          test -d "$app_bundle/PlugIns/MoumusicWidget.appex"
          test -f "$app_bundle/zh-Hans.lproj/InfoPlist.strings"
          test -f "$app_bundle/en.lproj/InfoPlist.strings"

          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/Music-ipa" "$GITHUB_WORKSPACE/Music-ios-unsigned.ipa"
          unzip -l "$GITHUB_WORKSPACE/Music-ios-unsigned.ipa"
          test -s "$GITHUB_WORKSPACE/Music-ios-unsigned.ipa"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Music-ios-unsigned
          path: Music-ios-unsigned.ipa
          if-no-files-found: error
